name: Herencia - comprobar sincronización Vercel y Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: herencia-public-release-consistency
  cancel-in-progress: true

jobs:
  verify-public-release:
    name: Verificar que web y API son el GitHub main
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Esperar publicación del merge
        if: github.event_name == 'push'
        run: sleep 180
      - name: Comparar versiones reales de Vercel y Railway
        env:
          HERENCIA_SITE_URL: https://www.herenciamarket.es
          HERENCIA_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for intento in 1 2 3 4 5; do
            echo "Comprobación $intento de 5: web + API + GitHub main"
            if node scripts/checkDeploymentParity.mjs; then
              echo "Publicación sincronizada."
              exit 0
            fi
            if [ "$intento" -lt 5 ]; then sleep 45; fi
          done
          echo "::error::Vercel y Railway no están ambos publicados desde el commit principal. Revisa cuota, permisos y despliegues antes de dar la actualización por terminada."
          exit 1
