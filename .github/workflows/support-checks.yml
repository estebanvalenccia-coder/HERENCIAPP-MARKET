name: Support chat checks

on:
  push:
    branches:
      - feature/herencia-customer-support-inbox
  pull_request:
    paths:
      - "backend/customerSupportAI*"
      - "backend/server.js"
      - "backend/neonDb.js"
      - "src/app/components/CustomerSupport.tsx"
      - "src/app/pages/Contact.tsx"
      - "src/app/pages/Profile.tsx"
      - "src/app/pages/AdminDashboard.tsx"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test and build
        run: npm run build
