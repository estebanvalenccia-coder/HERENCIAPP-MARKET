name: Herencia visual admin E2E
on:
  pull_request:
    paths:
      - "src/app/**"
      - "backend/**"
      - "tests/adminVisualSmoke.mjs"
      - ".github/workflows/admin-visual-e2e.yml"
  push:
    branches: ["feature/admin-universal-controls-20261027"]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install application and browser runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.0
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Launch isolated Vite server
        shell: bash
        run: |
          set -euo pipefail
          nohup node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 > vite-e2e.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat vite-e2e.log
          exit 1

      - name: Verify real storefront draft preview and mobile
        run: node tests/adminVisualSmoke.mjs
        env:
          ADMIN_E2E_ORIGIN: http://127.0.0.1:4173

      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-e2e
          path: |
            admin-e2e-desktop.png
            admin-e2e-mobile.png
            vite-e2e.log
          retention-days: 5
          if-no-files-found: ignore
