name: Herencia CI
on:
  push:
    branches: ["main", "feature/herencia-neural-command-center", "feature/herencia-neural-v2", "feat/professional-pos-suite"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Full tests and frontend build
        run: npm run build 2>&1 | tee full-build.log

      - name: Backend syntax
        run: |
          node --check backend/server.js 2>&1 | tee backend-syntax.log
          node --check backend/neonGateway.js 2>&1 | tee -a backend-syntax.log
          node --check backend/neonDb.js 2>&1 | tee -a backend-syntax.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herencia-ci-diagnostics
          path: |
            full-build.log
            backend-syntax.log
          if-no-files-found: ignore
          retention-days: 3
