name: Herencia CI
on:
  push:
    branches: ["feature/herencia-neural-command-center","feature/herencia-neural-v2"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Backend syntax
        run: node --check backend/server.js
