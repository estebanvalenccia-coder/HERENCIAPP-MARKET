name: Herencia CI
on:
  push:
    branches: ["feature/herencia-neural-command-center", "feature/herencia-neural-v2", "feat/professional-pos-suite"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply pending POS partial-refund UI patch
        if: github.actor != 'github-actions[bot]'
        run: python3 .github/scripts/apply_pos_partial_refund.py

      - name: Install
        run: npm install

      - name: POS tests
        run: npm run test:pos 2>&1 | tee pos-tests.log

      - name: Backend syntax
        run: node --check backend/server.js 2>&1 | tee backend-syntax.log

      - name: Frontend build
        run: npx vite build 2>&1 | tee vite-build.log

      - name: Commit validated POS UI patch
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "No source patch to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/admin/AdminPOS.tsx
          git commit -m "Add item-level partial refund controls to TPV"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herencia-ci-diagnostics
          path: |
            pos-tests.log
            backend-syntax.log
            vite-build.log
          if-no-files-found: ignore
          retention-days: 3
