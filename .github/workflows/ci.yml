name: Herencia CI
on:
  push:
    branches: ["main", "feature/herencia-neural-command-center", "feature/herencia-neural-v2", "feat/professional-pos-suite"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Full tests and frontend build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee full-build.log

      # Railway deploys with rootDirectory=backend and npm i from
      # backend/package.json. The root install alone can hide missing imports.
      - name: Railway isolated backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          isolated="$(mktemp -d)"
          trap 'rm -rf "$isolated"' EXIT
          cp -R backend/. "$isolated/"
          (
            cd "$isolated"
            npm install --ignore-scripts --no-audit --no-fund
            node --input-type=module -e "await import('./supplierFileSchema.js'); await import('./supplierFileImporter.js'); await import('./supplierFileProfiles.js'); console.log('Railway backend imports verified in isolation')"
          )

      - name: Backend syntax
        shell: bash
        run: |
          set -o pipefail
          node --check backend/server.js 2>&1 | tee backend-syntax.log
          node --check backend/neonGateway.js 2>&1 | tee -a backend-syntax.log
          node --check backend/neonDb.js 2>&1 | tee -a backend-syntax.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herencia-ci-diagnostics
          path: |
            full-build.log
            backend-syntax.log
          if-no-files-found: ignore
          retention-days: 3
